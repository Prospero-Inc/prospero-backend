services:
  prospero:
    container_name: prospero-service
    init: true
    restart: unless-stopped
    image: ghcr.io/prospero-inc/prospero-backend:latest
    environment:
      NODE_ENV: production
      TZ: America/El_Salvador
      API_BASE_URL: ${API_BASE_URL}
      API_BASE_URL_RESET: ${API_BASE_URL_RESET}
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SERVICE: ${MAIL_SERVICE}
      MAIL_USER: ${MAIL_USER}
      SECRET: ${SECRET}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    # Loopback only: Caddy (on the host) and the Next server (on the
    # `prospero` network) are the only clients. Publishing on every interface
    # let anyone skip Caddy, and `trust proxy` assumes private sources are ours.
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - prospero

networks:
  prospero:
    external: true
    name: prospero
