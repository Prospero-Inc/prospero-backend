name: CI

# Runs on every pull request (any base branch): lint, unit tests, build and
# the e2e suites, including the auth flows against a real, throwaway Postgres.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prospero_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database only: test/auth-flows.e2e-spec.ts refuses to
      # run against any non-local host.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prospero_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/prospero_e2e
      SECRET: ci-only-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
