name: Node.js CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/prospero-inc/prospero-backend

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.16.0]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted

    # Doppler's CLI reads DOPPLER_TOKEN from the environment — a read-only
    # service token scoped to the prospero-backend project's `prd` config.
    # Every command that needs app env vars runs under `doppler run --`,
    # which injects them into the process so `docker compose` can
    # interpolate docker-compose.yml's ${VAR} references.
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Doppler CLI and token
        # Fail fast before touching the running container: a missing CLI or
        # bad token would otherwise make compose silently fall back to blank
        # strings for every variable.
        run: doppler secrets download --no-file --format env > /dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: doppler run -- docker compose pull

      - name: Run Prisma migrations
        # prisma is a devDependency, so it's not in the production image's
        # node_modules — npx fetches it fresh. Keep this version pin in
        # sync with package.json's "prisma"/"@prisma/client" version to
        # avoid a CLI/client mismatch.
        run: |
          doppler run -- docker run --rm -e DATABASE_URL -e DIRECT_URL --network prospero \
            ${{ env.IMAGE }}:latest npx --yes prisma@5.16.1 migrate deploy

      - name: Stop existing container
        run: doppler run -- docker compose down

      - name: Deploy Docker container
        run: doppler run -- docker compose up -d

      - name: Clean up old images
        run: docker image prune -a -f
