name: Node.js CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/prospero-inc/prospero-backend

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.23.4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted

    # Doppler's CLI reads DOPPLER_TOKEN from the environment — a read-only
    # service token scoped to the prospero-backend project's `prd` config.
    # Every command that needs app env vars runs under `doppler run --`,
    # which injects them into the process so `docker compose` can
    # interpolate docker-compose.yml's ${VAR} references.
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # Deploy exactly the image built from this commit, never `latest`;
      # docker-compose.yml reads it as ${IMAGE_TAG}.
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Doppler CLI and token
        # Fail fast before touching the running container: a missing CLI or
        # bad token would otherwise make compose silently fall back to blank
        # strings for every variable.
        run: doppler secrets download --no-file --format env > /dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the running image for rollback
        # Tag whatever is running now as :rollback before anything changes,
        # so a failed deploy can go back to it in one command. No-op on the
        # very first deploy (no container yet).
        run: |
          RUNNING=$(docker inspect --format '{{.Image}}' prospero-service 2>/dev/null || true)
          if [ -n "$RUNNING" ]; then docker tag "$RUNNING" ${{ env.IMAGE }}:rollback; fi

      - name: Pull this commit's image
        run: doppler run -- docker compose pull

      - name: Run Prisma migrations
        # prisma is a devDependency, so it's not in the production image's
        # node_modules — npx fetches it fresh. Keep this version pin in
        # sync with package.json's "prisma"/"@prisma/client" version to
        # avoid a CLI/client mismatch. Migrations must stay backwards
        # compatible (expand → migrate → contract) so a rollback still works.
        run: |
          doppler run -- docker run --rm -e DATABASE_URL -e DIRECT_URL --network prospero \
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} npx --yes prisma@5.16.1 migrate deploy

      - name: Deploy and wait until healthy
        id: deploy
        # No `down` first: compose recreates the container in place, so the
        # outage is just the new container's startup instead of
        # pull + stop + start. --wait blocks on docker-compose.yml's
        # healthcheck (GET /api/health, which checks the database).
        run: doppler run -- docker compose up -d --wait --wait-timeout 120

      - name: Roll back to the previous image
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::New image failed its health check, rolling back"
          docker logs --tail 100 prospero-service || true
          IMAGE_TAG=rollback doppler run -- docker compose up -d --wait --wait-timeout 120

      - name: Clean up old images
        # Keep the image just deployed and :rollback; drop older commit tags
        # (an image still in use by a container can't be removed — fine).
        run: |
          docker images ${{ env.IMAGE }} --format '{{.Tag}} {{.ID}}' \
            | awk -v keep="${{ env.IMAGE_TAG }}" '$1 != keep && $1 != "rollback" && $1 != "latest" {print $2}' \
            | sort -u | xargs -r docker rmi || true
          docker image prune -f
